<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link rel="stylesheet" href="file.css">
            <title>Rock, Paper, Scissors Game</title>
        </head>
        <body>
            <div class="container">
            <h1>Rock, Paper, Scissors Game</h1>
            <p>Select either Rock, Paper or Scissors. First to 5 wins. Click start to begin.</p>

            <button id="startBtn">Start Round</button>
            <p id="countdown">Click Start Round to begin.</p>
            
        <div class="choices">
            <button id="rockBtn">✊ Rock</button>
            <button id="paperBtn">🖐️ Paper</button>
            <button id="scissorsBtn">✌️ Scissors</button>
        </div>

            <p id="playerChoice">Your choice: </p>
            <p id="computerChoice">Computer's choice: </p>
            <p id="result"></p>

            <p id="scoreboard">
                You <span id="playerScore">0</span> - <span id="computerScore">0</span> Computer
            </p>

            <button id="resetBtn">Reset game</button>
            </div>

            <script src="file.js"></script>
        </body>
    </html>
